org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration on demand: lets `gradle :domain:test` configure only the
# :domain module (a pure-Kotlin/JVM module) without also configuring the
# :app module, which applies the Android Gradle Plugin and requires an
# installed Android SDK. This is what makes the domain module buildable
# and testable in SDK-less environments (see README "Limitations connues").
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official
