name: Build APK

# Builds app/ on a GitHub-hosted runner, which has full internet access and
# an Android SDK — unlike the sandbox this project was scaffolded in, which
# has neither (see README.md, "Limitations connues").
#
# The APK is then LAUNCHED ON A REAL EMULATOR before anything is published:
# the first green build here compiled perfectly and still crashed on startup,
# so "it compiles" is not evidence the app works. The release step runs only
# after that smoke test passes.
#
# Since 23/08/2026: a SIGNED release APK is also built (secrets
# CUISSON_KEYSTORE_B64 / CUISSON_KEYSTORE_PASSWORD / CUISSON_KEY_PASSWORD /
# CUISSON_KEY_ALIAS) and published to the rolling "latest" release as
# app-v<version>.apk — the in-app auto-update (Réglages → Mise à jour) reads
# that release. Debug builds stay unsigned: the per-run debug.keystore of
# CI would change the signature on every build and break updates.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "domain/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write # needed to publish/update the "debug-latest" and "latest" releases below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run domain unit tests (EF-16 / EF-14 logic)
        run: ./gradlew :domain:test --stacktrace

      - name: Run app unit tests (update parser)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (build artifact — requires GitHub login to fetch)
        uses: actions/upload-artifact@v4
        with:
          name: cuisson-vapeur-legumes-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Enables hardware acceleration for the emulator on the runner, without
      # which booting an AVD is prohibitively slow.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The gate: install the APK on a real emulator and actually launch it.
      # If the app crashes or never reaches the foreground, this fails the job
      # and the publish step below never runs.
      - name: Smoke test — launch the app on an emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-test.sh

      # Actions artifacts are always zip-wrapped and gated behind a GitHub
      # login, even on a public repo. A release asset is a plain, permanent,
      # directly-downloadable URL with no auth needed — publish/overwrite a
      # rolling "debug-latest" release with the freshly built APK attached.
      # Reached only when the emulator smoke test above passed.
      - name: Publish debug APK to the rolling "debug-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug build (rolling, latest main)"
          body: |
            Automatically rebuilt from `main` @ ${{ github.sha }} by
            `.github/workflows/build-apk.yml`, and verified to launch on an
            Android 14 (API 34) emulator before publication. Unsigned debug
            build — see the root README's "Limitations connues".
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

      # Signed release build — same keystore on every run, so the in-app
      # auto-update can install it over the previous release APK.
      - name: Build signed release APK
        env:
          CUISSON_KEYSTORE_B64: ${{ secrets.CUISSON_KEYSTORE_B64 }}
          CUISSON_KEYSTORE_PASSWORD: ${{ secrets.CUISSON_KEYSTORE_PASSWORD }}
          CUISSON_KEY_PASSWORD: ${{ secrets.CUISSON_KEY_PASSWORD }}
          CUISSON_KEY_ALIAS: ${{ secrets.CUISSON_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release APK signature
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      # Rolling "latest" release holding the signed APK renamed app-v<version>.apk
      # (the update parser reads the version from the tag or the asset name).
      - name: Publish signed release APK to rolling "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "app-v${VERSION}.apk"
          gh release delete latest --yes --repo "${{ github.repository }}" || true
          for i in 1 2 3 4 5; do
            if gh release create latest "app-v${VERSION}.apk" --repo "${{ github.repository }}" \
              --title "Cuisson vapeur — dernière version (v${VERSION})" \
              --notes "APK signé — mise à jour automatique depuis l'app (Réglages → Mise à jour). Build ${{ github.sha }}."; then
              echo "Published latest v${VERSION}"
              break
            fi
            sleep 10
          done
